name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Download offline Vosk speech model (bundled into the APK)
        run: |
          curl -L -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-en-in-0.4.zip
          unzip -q model.zip
          cp -r vosk-model-small-en-in-0.4/* app/src/main/assets/model-en/
          rm -rf model.zip vosk-model-small-en-in-0.4

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: OfflineTouchFreeAI-apk
          path: app/build/outputs/apk/debug/app-debug.apk
